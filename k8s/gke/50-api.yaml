# Public-facing API and LangGraph coordinator.
# Stateless: every replica reads and commits through Cloud SQL, so any
# replica can serve any user (the system appears as one service).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storytelling-api
  namespace: storytelling
  labels:
    app.kubernetes.io/name: storytelling-api
    app.kubernetes.io/component: coordinator
    app.kubernetes.io/part-of: storytelling
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: storytelling-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storytelling-api
        app.kubernetes.io/component: coordinator
        app.kubernetes.io/part-of: storytelling
      annotations:
        storytelling/config-hash: "__CONFIG_HASH__"
    spec:
      automountServiceAccountToken: false
      # Agentic revisions can run for several minutes; allow in-flight
      # requests to finish when a pod is scaled down or replaced.
      terminationGracePeriodSeconds: 330
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: storytelling-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: storytelling-api
      containers:
        - name: api
          image: __IMAGE__
          command:
            - uvicorn
            - app.api.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --timeout-graceful-shutdown
            - "300"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: storytelling-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: storytelling-db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: storytelling-db-credentials
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                # Give the load balancer time to stop routing to this pod.
                command: ["sleep", "15"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: storytelling-api-backend
  namespace: storytelling
spec:
  # The load balancer default (30 s) is shorter than a multi-agent revision.
  timeoutSec: 900
  connectionDraining:
    drainingTimeoutSec: 60
  healthCheck:
    type: HTTP
    requestPath: /health/ready
    port: 8000
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: storytelling-api
  namespace: storytelling
  labels:
    app.kubernetes.io/name: storytelling-api
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "storytelling-api-backend"}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: storytelling-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: storytelling-api
  namespace: storytelling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: storytelling-api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: storytelling-api
  namespace: storytelling
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storytelling-api
